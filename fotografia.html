  <meta name="description" content="Galería completa de fotografía por Agustín Labajian.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="styles.css">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-color);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    .all-photos-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(245, 245, 247, 0.72);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      z-index: 1;
      cursor: pointer;
    }

    body.dark-mode .all-photos-backdrop {
      background: rgba(10, 10, 12, 0.72);
    }

    .all-photos-container {
      position: relative;
      width: 100%;
      max-width: 1720px;
      margin: 0 auto;
      padding: 140px 3.5vw 100px 3.5vw;
      box-sizing: border-box;
      z-index: 2;
    }

    .photo-grid-full {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      width: 100%;
      margin-top: 24px;
    }

    @media (max-width: 960px) {
      .photo-grid-full {
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
      }
      .all-photos-container {
        padding: 110px 3.5vw 80px 3.5vw;
      }
    }

    @media (max-width: 580px) {
      .photo-grid-full {
        grid-template-columns: 1fr;
        gap: 14px;
      }
      .all-photos-container {
        padding: 85px 4vw 60px 4vw;
      }
    }
  </style>
</head>

  <!-- PANTALLA COMPLETA / MODAL DE FOTOGRAFÍA (LIGHTBOX) -->
  <div id="photo-modal" class="photo-modal" onclick="closePhotoModal()">
    <div class="photo-modal-backdrop"></div>
    <div class="photo-modal-content">
      <img id="photo-modal-img" class="photo-modal-img" src="" alt="Fotografía en grande">
    </div>
  </div>

  <script>
    // Recuperar tema
    try {
      const savedTheme = localStorage.getItem('portfolio-theme');
      if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
      }
    } catch(e) {}

    // Idioma
    let currentLang = 'ES';
    try {
      const savedLang = localStorage.getItem('portfolio-lang');
      if (savedLang === 'EN') {
        currentLang = 'EN';
        document.getElementById('foto-title').textContent = 'Photography';
      }
    } catch(e) {}

    function goBackToHome() {
      sessionStorage.setItem('skipIntroFromPhoto', 'true');
      window.location.href = 'index.html#sec-fotografia';
    }

    // Modal / Lightbox de fotografía
    let currentActivePhoto = null;
    function openPhotoModal(src) {
      const modal = document.getElementById('photo-modal');
      const img = document.getElementById('photo-modal-img');
      if (modal && img) {
        img.src = src;
        currentActivePhoto = src;
        modal.classList.add('is-active');
        document.body.style.overflow = 'hidden';
      }
    }

    function closePhotoModal() {
      const modal = document.getElementById('photo-modal');
      if (modal) {
        modal.classList.remove('is-active');
        currentActivePhoto = null;
        document.body.style.overflow = '';
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (currentActivePhoto) {
          closePhotoModal();
        } else {
          goBackToHome();
        }
      }
    });

    // Cursor cartesiano y hover
    const cursorContainer = document.getElementById('custom-cursor');
    const cursorAxisH = document.getElementById('cursor-axis-h');
    const cursorAxisV = document.getElementById('cursor-axis-v');
    const cursorDot = document.getElementById('cursor-dot');
    const cursorPillText = document.getElementById('cursor-pill-text');

    window.addEventListener('mousemove', (e) => {
      const mouseX = e.clientX;
      const mouseY = e.clientY;

      if (cursorContainer) {
        cursorContainer.classList.add('is-active');
      }
      if (cursorAxisH) {
        cursorAxisH.style.transform = `translateY(${mouseY}px)`;
      }
      if (cursorAxisV) {
        cursorAxisV.style.transform = `translateX(${mouseX}px)`;
      }
      if (cursorDot) {
        cursorDot.style.left = `${mouseX}px`;
        cursorDot.style.top = `${mouseY}px`;
      }
    });

    const photoCards = document.querySelectorAll('.photo-card');
    photoCards.forEach(photo => {
      photo.addEventListener('mouseenter', () => {
        if (cursorDot) {
          cursorDot.classList.add('is-card-hover');
          if (cursorPillText) {
            cursorPillText.textContent = currentLang === 'ES' ? 'Ver Foto' : 'View Photo';
          }
        }
      });
      photo.addEventListener('mouseleave', () => {
        if (cursorDot) {
          cursorDot.classList.remove('is-card-hover');
        }
      });
    });
  </script>
</body>
</html>
